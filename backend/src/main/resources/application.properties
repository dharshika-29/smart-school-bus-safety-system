# ---------- Server ----------
server.port=${PORT:8080}

# ---------- MySQL (Railway Environment Variables) ----------
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:bus_safety}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:dharshi@29}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ---------- Hikari Connection Pool (Fixes Connection Drops) ----------
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000

# ---------- JWT ----------
app.jwt.secret=${JWT_SECRET:change_this_device_secret_key54-n}
app.jwt.expiration-ms=604800000

# ---------- Device key ----------
app.device.key=${DEVICE_KEY:change_this_device_secret_keytuil}

# ---------- CORS ----------
app.cors.allowed-origins=http://localhost:5173,http://localhost:3000,https://*.vercel.app